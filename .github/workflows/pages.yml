name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'themes/**', 'tools/gen-site.py', 'tools/themeparse.py', 'tools/check-site.py', 'lib/backend.sh', 'lib/backends/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages cannot be enabled on a private repository without a paid plan. Kept even
    # now the repo is public: it costs nothing and documents the dependency.
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The site's own gate, run HERE, before upload. This workflow has no dependency
      # on ci.yml — it cannot, because workflow_run has no paths filter — so a docs
      # push used to deploy whatever it contained while ci went red afterwards. And
      # docs/install.sh is the file every `curl … | sh` executes.
      - name: Install deps
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y shellcheck dash
      - name: Gate the site
        run: |
          set -eu
          make docs
          git diff --exit-code -- docs/index.html \
            || { echo "FAIL: docs/index.html is stale — run 'make docs' and commit"; exit 1; }
          python3 tools/check-site.py docs/index.html
          sh -n docs/install.sh
          dash -n docs/install.sh
          shellcheck -s sh -S warning docs/install.sh

      # No build step on purpose: docs/ is served byte-for-byte as committed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
