name: release

# Tag-driven, not `release: published`. With a release trigger the release already
# exists and is already `latest` before a single test has run, so a red gate cannot
# un-publish it. A tag push means the only thing that exists until the gate is green
# is the tag.
#
# ORDER IS THE WHOLE DESIGN. The release is created as a DRAFT, its assets are
# downloaded back and installed the way a stranger would, and only then is the draft
# bit flipped. A draft is excluded from `latest` and its assets are not downloadable
# without a token, so nothing broken can be served, even for a second. If anything
# after the create fails, the release is re-drafted — so `latest` falls back to the
# previous good release rather than pointing at a half-published one.
#
# ci.yml fires on push-to-main and pull_request; a tag push triggers neither. So the
# full gate is repeated here: without it the one path to the public would be the one
# path with no tests in front of it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v2.0.0'
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # the only elevated scope, and only in this job
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSET: color-terminal
    steps:
      - name: Resolve the tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a vX.Y.Z release tag"; exit 1 ;;
          esac
          pre=false; case "$tag" in *-*) pre=true ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.t.outputs.tag }}
          persist-credentials: false

      # CT_VERSION in lib/common.sh is the only version string in the project. If it
      # and the tag disagree, the artifact lies about itself. A prerelease tag
      # (v2.1.0-rc.1) must match on its BASE (2.1.0): that base is what every later
      # step keys on — the changelog section, the version the artifact reports.
      - name: Assert the tag matches CT_VERSION
        id: v
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -eu
          line=$(grep -n '^CT_VERSION=' lib/common.sh | head -1 | cut -d: -f1)
          v=$(sed -n 's/^CT_VERSION=\(.*\)$/\1/p' lib/common.sh | head -1)
          [ -n "$v" ] || { echo "::error::could not parse CT_VERSION from lib/common.sh"; exit 1; }
          base=${TAG#v}; base=${base%%-*}
          [ "$base" = "$v" ] || {
            echo "::error file=lib/common.sh,line=${line:-1}::tag $TAG claims $base, lib/common.sh says CT_VERSION=$v"
            exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Release notes are the changelog section for the BASE version, so an rc reuses
      # the section of the release it rehearses. Literal prefix match, not a regex:
      # the heading contains [ and ], and getting those through a shell string into a
      # dynamic awk regex intact silently matches nothing.
      - name: Release notes must exist
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          awk -v want="## [$VERSION]" 'index($0, want) == 1 {found = 1} END {exit !found}' CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no '## [$VERSION]' section"; exit 1; }

      - name: Install deps
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y shellcheck dash

      - name: Lint (syntax + shellcheck + theme contrast gate + site checks)
        run: make lint

      - name: Build the artifact and its checksum
        run: |
          set -eu
          make dist
          # Generated from INSIDE dist/ so the file names the artifact with no
          # directory component: `sha256sum -c` reads the filename out of this file.
          ( cd dist && sha256sum "$ASSET" > SHA256SUMS && sha256sum -c SHA256SUMS )
          cat dist/SHA256SUMS

      # ./test/run.sh, not `make test`: the test target depends on the dist rule and
      # would rebuild the file whose checksum was just taken.
      - name: Test (pty escapes, detection matrix, concurrency, latency, installers)
        run: ./test/run.sh

      - name: The artifact must report the tagged version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          got=$(dist/color-terminal --version | tr -d '\r')
          [ "$got" = "color-terminal $VERSION" ] || { echo "::error::artifact says '$got', expected 'color-terminal $VERSION'"; exit 1; }

      # Draft, always. A fresh release is created as one; an existing release being
      # re-run is put BACK into draft before its assets are replaced, so the window in
      # which `latest` has half-replaced assets does not exist — `latest` falls back
      # to the previous release for the duration instead.
      - name: Publish as a draft
        env:
          TAG: ${{ steps.t.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRE: ${{ steps.t.outputs.pre }}
        run: |
          set -eu
          notes=$(mktemp)
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || { echo "::error::extracted empty release notes for $TAG"; exit 1; }
          {
            printf '\n### Install\n\n'
            printf '```sh\ncurl -fsSL https://lariocpt.github.io/color-terminal/install.sh | sh\n```\n\n'
            printf 'The installer verifies this checksum before it runs anything:\n\n```\n%s\n```\n' \
                   "$(cat dist/SHA256SUMS)"
          } >> "$notes"

          pre_flag='--prerelease=false'; [ "$PRE" = true ] && pre_flag='--prerelease'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft
            gh release upload "$TAG" dist/"$ASSET" dist/SHA256SUMS --clobber
            # A re-run exists to fix something; the notes and title are part of that.
            gh release edit "$TAG" --title "color-terminal ${TAG#v}" --notes-file "$notes" "$pre_flag"
          else
            gh release create "$TAG" dist/"$ASSET" dist/SHA256SUMS \
              --draft --verify-tag \
              --title "color-terminal ${TAG#v}" \
              --notes-file "$notes" "$pre_flag"
          fi

      # The draft's assets, downloaded back and installed the way a stranger would —
      # BEFORE anything is public. This is the only step that proves the PUBLISHED
      # bytes work, rather than the local build that produced them.
      - name: Verify the draft's assets end to end
        env:
          TAG: ${{ steps.t.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          want=$(ls themes/*.theme | wc -l)
          d=$(mktemp -d); mkdir -p "$d/home" "$d/run"
          gh release download "$TAG" --dir "$d" --pattern "$ASSET" --pattern SHA256SUMS
          ( cd "$d" && sha256sum -c SHA256SUMS )
          chmod +x "$d/$ASSET"                  # release assets arrive without the bit
          got=$("$d/$ASSET" --version | tr -d '\r')
          [ "$got" = "color-terminal $VERSION" ] || { echo "::error::published asset says '$got'"; exit 1; }
          HOME="$d/home" XDG_RUNTIME_DIR="$d/run" CT_QUIET=1 \
            "$d/$ASSET" --install --no-wire >/dev/null
          n=$(ls "$d/home/.local/share/color-terminal/themes"/*.theme 2>/dev/null | wc -l)
          [ "$n" -eq "$want" ] || { echo "::error::published asset installed $n themes, expected $want"; exit 1; }

      # Only now does it become visible. `--latest` only when this tag is the highest
      # non-prerelease semver: re-publishing an older tag must never demote the
      # current release and downgrade everyone running the one-liner.
      - name: Flip it live
        env:
          TAG: ${{ steps.t.outputs.tag }}
          PRE: ${{ steps.t.outputs.pre }}
        run: |
          set -eu
          latest='--latest=false'
          if [ "$PRE" != true ]; then
            top=$({ gh release list --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'; echo "$TAG"; } | sort -V | tail -1)
            [ "$top" = "$TAG" ] && latest='--latest'
          fi
          gh release edit "$TAG" --draft=false "$latest"
          echo "published $TAG ($latest)"

      # Anything above failed after the release was created: put it back into draft,
      # so `latest` is the previous good release and the failed one serves nothing.
      - name: Re-draft on failure
        if: failure()
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft && echo "re-drafted $TAG"
          fi

      # The exact path docs/install.sh takes, unauthenticated, with a bounded retry
      # for the redirect/CDN to catch up — and a version compare, because a stale
      # `latest` serving the previous release would pass every checksum.
      - name: The public install path serves this release
        if: ${{ github.event.repository.private == false && steps.t.outputs.pre != 'true' }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          d=$(mktemp -d); mkdir -p "$d/run"
          for i in 1 2 3 4 5 6; do
            rm -rf "$d/home"; mkdir -p "$d/home"
            if HOME="$d/home" XDG_RUNTIME_DIR="$d/run" CT_QUIET=1 \
                 sh docs/install.sh --no-wire --prefix="$d/home/.local" >/dev/null 2>&1 \
               && [ "$("$d/home/.local/bin/$ASSET" --version)" = "color-terminal $VERSION" ]; then
              echo "public latest serves color-terminal $VERSION"; exit 0
            fi
            echo "attempt $i: latest is not serving $VERSION yet"; sleep 10
          done
          echo "::error::the public latest URL never served $VERSION"; exit 1
