name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # There is no compiler here: the artifact IS the source (lib/*.sh), so the gate
  # is the real test suite rather than "does it build". test/run.sh allocates a
  # pty, plays the terminal, and asserts the exact escape bytes, the marker-block
  # surgery, the concurrency behaviour and the latency budget — all with no
  # terminal emulator installed, which is exactly what a CI container has. The same
  # gate the Jenkinsfile runs before it will publish to the apps plane, so a red
  # suite never reaches /srv/apps or the page.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: |
          set -eu
          # shellcheck is an optional-but-preferred lint dependency; make lint runs
          # it when present and falls back to `bash -n` when not. CI installs it so
          # the published gate is the strong one, not the syntax-only one. dash is
          # there for docs/install.sh, which is piped to `sh` by strangers and must
          # parse under a real POSIX shell, not just bash in disguise.
          sudo apt-get update
          sudo apt-get install -y shellcheck dash
      - name: Lint (syntax + shellcheck + theme contrast gate)
        run: make lint
      - name: Build the single-file artifact
        run: |
          set -eu
          make dist
          ls -lh dist/color-terminal
      - name: Test (pty escapes, detection matrix, concurrency, latency, self-install)
        run: make test
      # docs/ is a release surface too, not just docs: it is the file GitHub Pages
      # serves. A stray remote asset or a page-level scroll would break it for
      # somebody, so mirror the two checks in docs/README.md.
      - name: Check the website stays self-contained
        run: |
          set -eu
          python3 -c "import html.parser; html.parser.HTMLParser().feed(open('docs/index.html').read())"
          if grep -nE '<(link|script|img)[^>]+(src|href)="https?:' docs/index.html; then
            echo "FAIL: docs/index.html references a remote asset (must be one self-contained file)"
            exit 1
          fi

      # The site advertises an install URL that points at a file in this same
      # directory, and the two are deployed by one workflow but written by hand in
      # three places. If one moves and the others do not, the headline install command
      # 404s and nobody finds out until a stranger tries it.
      - name: The advertised install command matches what is published
        run: |
          set -eu
          url="https://lariocpt.github.io/color-terminal/install.sh"
          test -f docs/install.sh || { echo "FAIL: docs/install.sh is missing"; exit 1; }
          grep -q "^CT_REPO_DEFAULT='${GITHUB_REPOSITORY}'" docs/install.sh \
            || { echo "FAIL: docs/install.sh does not default to ${GITHUB_REPOSITORY}"; exit 1; }
          for f in docs/index.html README.md; do
            grep -qF "$url" "$f" || { echo "FAIL: $f does not advertise $url"; exit 1; }
          done

      # The three generated sections of the site are built from themes/ by
      # tools/gen-site.py. Regenerating must be a no-op, or the page on the web is
      # showing colours the tool no longer ships.
      - name: The generated sections of the site are up to date
        run: |
          set -eu
          make docs
          git diff --exit-code -- docs/index.html \
            || { echo "FAIL: docs/index.html is stale — run 'make docs' and commit"; exit 1; }
